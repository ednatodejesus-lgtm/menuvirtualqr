<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Fundo Preto com Cantos Arredondados -->
  <rect width="100" height="100" rx="22" fill="#000000"/>
  
  <!-- Grupo que vai desenhar as letras bem grandes e depois encolher -->
  <g transform="translate(50, 50) scale(0.9) translate(-50, -50)">
    
    <!-- Letra M (Branca) -->
    <text x="38" y="65" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="35" fill="#FFFFFF" text-anchor="middle">M</text>
    
    <!-- Letra Q (Dourada) -->
    <text x="68" y="65" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="35" fill="#D4A34A" text-anchor="middle">Q</text>
    
  </g>
</svg>