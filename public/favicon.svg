<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Fundo Preto com Cantos Arredondados (rx=22 cria o efeito de app) -->
  <rect width="100" height="100" rx="22" fill="#000000"/>
  
  <!-- Grupo centralizado que vai alinhar as letras lado a lado -->
  <g font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="40" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">
    
    <!-- Letra M (Branca) -->
    <text x="35" y="50">M</text>
    
    <!-- Letra Q (Dourada) -->
    <text x="65" y="50" fill="#D4A34A">Q</text>
    
  </g>
</svg>